<nav class="breadcrumb">
  <span class="breadcrumb-item active">News</span>
</nav>
<app-removed-subdomain-info></app-removed-subdomain-info>
<h1>News</h1>
<div class="container mt-5">
  <div class="coffee-banner">
    <h3>Support Synopackage!</h3>
    <p>If you find my content helpful, consider buying me a coffee to keep me going!</p>
    <a href="https://www.buymeacoffee.com/synopackage" target="_blank"><img
        src="https://img.buymeacoffee.com/button-api/?text=Support&emoji=&slug=synopackage&button_colour=5F7FFF&font_colour=ffffff&font_family=Cookie&outline_colour=000000&coffee_colour=FFDD00" /></a>
    <br /> <br /> <a href="https://github.com/sponsors/szyb" target="_blank">❤ Github sponsors ❤</a>
  </div>
</div>
<div *ngIf="!news">
  <app-wait></app-wait>
</div>
<div *ngFor="let n of news">
  <div class="pb-3">
    <blockquote class="blockquote bq-primary">
      <p class="bq-title">{{ n.title }}</p>
      <span style="font-size: 0.8rem">{{ n.date | date : 'yyyy-MM-dd'}}</span>
    </blockquote>
    <div class="rounded border px-2 py-2">
      <p *ngFor="let b of n.body">{{ b }}</p>
      <div *ngIf="n.routerLinkDescription">
        <a [routerLink]="n.routerLink">{{n.routerLinkDescription}}</a>
      </div>
      <div *ngIf="n.externalLinkDescription">
        <a href="{{n.externalLink}}" target="_blank" rel="noopener noreferrer">{{n.externalLinkDescription}}</a>
      </div>
    </div>
  </div>
</div>
<app-paginator #paginator [dataProvider]="this" (changed)="onPageChange($event)"></app-paginator>
